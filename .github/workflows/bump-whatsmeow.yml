# SPDX-License-Identifier: GPL-3.0-or-later
#
# Opens a pull request that bumps whatsmeow, which follows WhatsApp's
# protocol changes. By default it takes the newest commit on
# whatsmeow's main that is at least two weeks old (security.md §6); a
# manual run can name any ref, for a ClientOutdated emergency.
#
# The new code runs only in the test job, which has a read-only token and
# keeps no credentials in its checkout. The job that pushes and opens the
# pull request runs no module code: go get and go mod tidy only resolve
# and download.
name: Bump whatsmeow

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: 'whatsmeow commit or branch (empty: the newest commit at least 14 days old)'
        required: false
        default: ''

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.choose.outputs.ref }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed go git github-cli sqlite

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the commit
        id: choose
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -n "$REF" ]; then
            ref=$REF
          else
            until=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
            ref=$(gh api "repos/tulir/whatsmeow/commits?sha=main&until=$until&per_page=1" --jq '.[0].sha')
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Bump and test
        id: bump
        env:
          REF: ${{ steps.choose.outputs.ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go get "go.mau.fi/whatsmeow@$REF"
          go mod tidy
          if git diff --quiet; then
            echo "whatsmeow is current"
            exit 0
          fi
          go test -tags sqlite_fts5 ./...
          echo "version=$(go list -m -f '{{.Version}}' go.mau.fi/whatsmeow)" >> "$GITHUB_OUTPUT"

  pull-request:
    needs: test
    if: needs.test.outputs.version != ''
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed go git github-cli

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.test.outputs.ref }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          branch="bump-whatsmeow-$VERSION"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "a pull request for $VERSION is open already"
            exit 0
          fi
          go get "go.mau.fi/whatsmeow@$REF"
          go mod tidy
          if [ -n "$(git status --porcelain -- . ':!go.mod' ':!go.sum')" ]; then
            echo "only go.mod and go.sum may change:"
            git status --porcelain
            exit 1
          fi
          git switch -C "$branch"
          git add go.mod go.sum
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "build(deps): bump whatsmeow to $VERSION"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" --title "build(deps): bump whatsmeow to $VERSION" \
            --body "The newest whatsmeow commit at least two weeks old, or the ref a manual run named. The tests passed in the workflow; run \`make ci\` locally before merging, since pull requests opened with the workflow token do not start CI."
